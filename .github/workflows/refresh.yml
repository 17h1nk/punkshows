name: refresh
# Re-scrapes the shows and commits a fresh shows.html; GitHub Pages serves it.
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
jobs:
  refresh:
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 requests pillow flask
      - run: python snapshot.py --web
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41876826+github-actions[bot]@users.noreply.github.com"
          git add index.html thumbs
          git diff --quiet HEAD || git commit -m "refresh shows"
          git push origin HEAD:main
