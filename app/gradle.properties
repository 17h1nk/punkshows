kotlin.code.style=official
android.useAndroidX=true
# Pinned toolchain (see AGENTS.md): Gradle 8.12.1, AGP 8.6.0, Kotlin 2.0.21, Compose plugin 2.0.21
android.suppressUnsupportedCompileSdk=36
# androidx Compose deps need more JVM metaspace than the Gradle default (384 MiB)
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=1024m -XX:+UseSerialGC
